<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ME-Receipt (ME Network)</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background-color: #0b111e;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #131c2e;
      border: 1px solid #1e2d47;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .header {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .header span {
      font-size: 13px;
      font-weight: 500;
      color: #10b981;
    }
    .field-group { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 13px 14px;
      background-color: #1a253b;
      border: 1px solid #283754;
      border-radius: 10px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus, select:focus { border-color: #10b981; }
    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      background-color: #10b981;
      color: #06281e;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn:active { opacity: 0.9; }
    .receipt-box {
      background-color: #122429;
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      line-height: 1.65;
      font-size: 15px;
    }
    .verified-title {
      color: #34d399;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .copy-btn {
      background-color: #1e2d47;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 12px;
      margin-left: 8px;
      cursor: pointer;
    }
    .gas-text {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 4px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">ME-Receipt <span>(ME Network)</span></div>

    <!-- Checkout Form -->
    <div id="checkout-view">
      <div class="field-group">
        <label>Vendor / Freelancer Name</label>
        <input type="text" id="vendor" placeholder="e.g., Campus Kiosk" value="Campus Kiosk" />
      </div>

      <div class="field-group">
        <label>Item / Service Description</label>
        <input type="text" id="item" placeholder="e.g., Lunch & Juice" value="Lunch & Juice" />
      </div>

      <div class="field-group">
        <label>Base Amount</label>
        <input type="number" id="amount" placeholder="e.g., 5" value="5" min="0.01" step="any" />
      </div>

      <div class="field-group">
        <label>Token</label>
        <select id="token">
          <option value="USDT">USDT</option>
          <option value="MECS">MECS</option>
        </select>
      </div>

      <div class="field-group">
        <label>Add Tip</label>
        <select id="tip">
          <option value="0">0% Tip</option>
          <option value="5">5% Tip</option>
          <option value="10" selected>10% Tip</option>
          <option value="15">15% Tip</option>
        </select>
      </div>

      <button class="btn" onclick="generateReceipt()">Pay &amp; Lock Receipt</button>
    </div>

    <!-- Verified Receipt Card -->
    <div id="receipt-view" class="hidden">
      <div class="receipt-box">
        <div class="verified-title">&#10003; Verified on ME Network</div>
        <div>
          ID: <strong id="r-id">ME-284066</strong>
          <button class="copy-btn" id="copy-btn" onclick="copyReceiptId()">Copy ID</button>
        </div>
        <div>Vendor: <span id="r-vendor"></span></div>
        <div>Item: <span id="r-item"></span></div>
        <div>Tip: <span id="r-tip"></span></div>
        <div><strong>Total Paid: <span id="r-total"></span></strong></div>
        <div class="gas-text">Gas: 0.0001 MEC</div>
      </div>

      <button class="btn" onclick="resetForm()">New Payment</button>
    </div>
  </div>

  <script>
    function generateReceipt() {
      const vendor = document.getElementById("vendor").value.trim() || "Verified Vendor";
      const item = document.getElementById("item").value.trim() || "Goods / Service";
      const amount = parseFloat(document.getElementById("amount").value) || 0;
      const token = document.getElementById("token").value;
      const tipPercent = parseFloat(document.getElementById("tip").value) || 0;

      if (amount <= 0) {
        alert("Please enter a valid payment amount.");
        return;
      }

      const tipAmount = amount * (tipPercent / 100);
      const total = (amount + tipAmount).toFixed(2);
      const randomId = "ME-" + Math.floor(100000 + Math.random() * 900000);

      document.getElementById("r-id").textContent = randomId;
      document.getElementById("r-vendor").textContent = vendor;
      document.getElementById("r-item").textContent = item;
      document.getElementById("r-tip").textContent = tipPercent + "% (" + tipAmount.toFixed(2) + " " + token + ")";
      document.getElementById("r-total").textContent = total + " " + token;
      document.getElementById("copy-btn").textContent = "Copy ID";

      document.getElementById("checkout-view").classList.add("hidden");
      document.getElementById("receipt-view").classList.remove("hidden");
    }

    function copyReceiptId() {
      const idText = document.getElementById("r-id").textContent;
      navigator.clipboard.writeText(idText);
      document.getElementById("copy-btn").textContent = "Copied!";
    }

    function resetForm() {
      document.getElementById("receipt-view").classList.add("hidden");
      document.getElementById("checkout-view").classList.remove("hidden");
    }
  </script>

</body>
</html>
