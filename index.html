<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ME-Receipt</title>
<style>
  *{box-sizing:border-box;font-family:sans-serif}
  body{background:#0b1120;color:#fff;padding:12px;margin:0}
  .card{max-width:410px;margin:auto;background:#111827;padding:15px;border-radius:12px;border:1px solid #1f2937}
  label{display:block;font-size:11px;color:#cbd5e1;margin-bottom:3px}
  input,select{width:100%;padding:8px 10px;margin-bottom:9px;background:#1e293b;border:1px solid #334155;color:#fff;border-radius:7px;font-size:13px}
  .row{display:flex;gap:8px}
  .tips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
  .tip{padding:7px;background:#1e293b;border:1px solid #334155;color:#cbd5e1;border-radius:6px;font-weight:bold;cursor:pointer}
  .tip.on{background:#064e3b;border-color:#10b981;color:#6ee7b7}
  .gas{display:flex;justify-content:space-between;background:#0f172a;padding:7px 9px;border-radius:6px;font-size:11.5px;color:#94a3b8;margin-bottom:10px}
  .gas b{color:#fbbf24;font-family:monospace}
  .pay{width:100%;padding:12px;background:#10b981;color:#064e3b;font-weight:bold;border:0;border-radius:8px;font-size:15px;cursor:pointer}
  .rec{margin-top:12px;padding:12px;background:#122429;border:1px solid #10b981;border-radius:10px;display:none;font-size:12.5px;line-height:1.5}
  .rec.ref{background:#26161a;border-color:#f87171}
  .st{padding:6px;border-radius:6px;font-weight:bold;font-size:11.5px;text-align:center;margin-bottom:8px;background:#2b2110;color:#fde68a}
  .st.rel{background:#0f253e;color:#7dd3fc}
  .st.rfd{background:#3b171d;color:#fecaca}
  .meta{background:#0d1b20;padding:7px 9px;border-radius:6px;border-left:3px solid #fbbf24;margin-bottom:8px;font-family:monospace;font-size:11.5px}
  .mono{font-family:monospace;font-size:10.5px;color:#93c5fd;word-break:break-all}
  .hand{background:#064e3b;border:1px solid #10b98188;color:#a7f3d0;padding:7px;border-radius:7px;margin-top:8px;font-size:11.5px;font-weight:bold;text-align:center}
  .thx{margin-top:8px;padding:8px;background:#0d2b24;border:1px dashed #10b98188;border-radius:7px;text-align:center;font-size:11px;color:#cbd5e1}
  .thx b{display:block;color:#6ee7b7;font-size:12px;margin-bottom:2px}
  .scan{margin-top:10px;padding:8px;background:#f8fafc;color:#0f172a;border-radius:7px;text-align:center}
  .scan svg{width:100%;height:42px;display:block}
  .mrz{font-family:monospace;font-size:10.5px;font-weight:bold;background:#e2e8f0;padding:6px 4px;border-radius:4px;margin-top:6px;white-space:pre;overflow-x:auto}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .acts button{padding:8px;border-radius:6px;border:0;font-weight:bold;font-size:12px;cursor:pointer}
  .acts button:disabled{opacity:.4}
  .b1{background:#38bdf8;color:#082f49}.b2{background:#ef4444;color:#fff}.b3{grid-column:span 2;background:#1e293b;color:#cbd5e1}
</style>
</head>
<body>
<div class="card">
  <h3 style="margin:0 0 10px">ME-Receipt (Demo)</h3>
  <label>Customer Name</label><input id="c" value="Erick Otieno">
  <label>Customer ME ID</label><input id="cid" value="me1erick84x9m2p7q0w3e5r1">
  <label>Vendor Name</label><input id="v" value="Campus Kiosk">
  <label>Vendor ME ID</label><input id="vid" value="me1kiosk92x8a4m7p0q5w3e9">
  <label>Item / Service</label><input id="it" value="Lunch & Juice">
  <label>Amount & Currency</label>
  <div class="row">
    <input id="a" type="number" value="10" min="0.01" step="0.01" style="flex:2">
    <select id="cur" style="flex:1"><option>MECS</option><option>USDT</option></select>
  </div>
  <label>Optional Tip</label>
  <div class="tips">
    <button type="button" class="tip on" data-p="0">0%</button>
    <button type="button" class="tip" data-p="5">5%</button>
    <button type="button" class="tip" data-p="10">10%</button>
    <button type="button" class="tip" data-p="15">15%</button>
  </div>
  <div class="gas"><span>Est. ME Network Gas Fee:</span><b id="gp">0.000200 MEC</b></div>
  <button type="button" id="pay" class="pay">&#128274; Pay &amp; Lock in Escrow</button>

  <div id="rec" class="rec">
    <div id="st" class="st">&#128274; Funds Locked in ME Escrow</div>
    <div class="meta">
      <div><b>Receipt:</b> <span id="rid"></span> | <b>SN:</b> <span id="sn" style="color:#fbbf24"></span></div>
      <div id="rf" style="color:#fca5a5;display:none"></div>
    </div>
    <div id="sum"></div><hr style="border-color:#1e3a3a">
    <div><b>Subtotal:</b> <span id="sub"></span> | <b>Tip:</b> <span id="tp"></span></div>
    <div style="color:#fbbf24;font-family:monospace"><b>Gas Fee:</b> <span id="gf"></span></div>
    <div style="color:#34d399;font-weight:bold">Total Paid: <span id="tot"></span></div>
    <div class="mono"><b>From:</b> <span id="oc"></span></div>
    <div class="mono"><b>To:</b> <span id="ov"></span></div>
    <div><b>Time:</b> <span id="tm"></span></div>
    <div class="mono"><b>Tx Hash:</b> <span id="hx"></span></div>
    <div id="hd" class="hand">&#129309; Equal Escrow Terms - Both Parties Agreed</div>
    <div class="thx"><b id="tt"></b><span id="ts"></span></div>
    <div class="scan">
      <div style="font-size:9px;font-weight:bold;color:#475569">UNIQUE BARCODE &amp; KENYA ID MRZ SCAN</div>
      <svg id="bsvg" xmlns="http://w3.org" preserveAspectRatio="none"></svg>
      <div id="btxt" style="font-family:monospace;font-size:10px;font-weight:bold"></div>
      <div id="mrz" class="mrz"></div>
    </div>
    <div class="acts">
      <button type="button" id="rel" class="b1">&#9989; Confirm Delivery</button>
      <button type="button" id="rfd" class="b2">&#8617; Issue Refund</button>
      <button type="button" id="rst" class="b3">+ New Payment</button>
    </div>
  </div>
</div><script>
(function(){
  var tip=0,oid="",sn="",cu="",ve="",tot=0,cr="MECS",gf=0.0001;
  var $=function(i){return document.getElementById(i)};
  var fee=function(x){return Number((0.0001+Math.max(0,parseFloat(x)||0)*0.00001).toFixed(6))};
  var hsh=function(){return"0x"+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)};
  function upd(){$("gp").textContent=fee($("a").value).toFixed(6)+" MEC"}
  function bar(code){
    var p="1010110",c=code.replace(/[^A-Z0-9]/gi,"").toUpperCase();
    for(var i=0;i<c.length;i++)p+=((c.charCodeAt(i)*37+i*13)%256).toString(2).padStart(8,"0")+"01";
    p+="110101";$("bsvg").setAttribute("viewBox","0 0 "+(p.length*2)+" 40");
    var r="";for(var j=0;j<p.length;j++)if(p[j]==="1")r+='<rect x="'+(j*2)+'" y="0" width="2" height="40" fill="#0f172a"/>';
    $("bsvg").innerHTML=r;$("btxt").textContent=code;
  }
  function mrz(s,c,v,t,u,rf){
    var pad=function(z){return z.toUpperCase().replace(/[^A-Z0-9<]/g,"<").padEnd(30,"<").slice(0,30)};
    var d=s.replace(/\D/g,""),sm=0;for(var i=0;i<d.length;i++)sm+=+d[i];var cd=sm%10,n=new Date();
    var dt=String(n.getFullYear()).slice(-2)+String(n.getMonth()+1).padStart(2,"0")+String(n.getDate()).padStart(2,"0");
    var am=String(Math.round(t*100)).padStart(8,"0");
    $("mrz").textContent=pad("IDKEN"+d+cd+"<<"+(rf?"REF":"ESC")+"<<<<<<<<<<")+"\n"+pad(dt+cd+u+am+"<<<<<<"+((cd+3)%10))+"\n"+pad(c.replace(/\s+/g,"<")+"<<"+v.replace(/\s+/g,"<"));
  }
  document.querySelectorAll(".tip").forEach(function(b){
    b.onclick=function(){tip=+b.dataset.p;document.querySelectorAll(".tip").forEach(function(x){x.classList.remove("on")});b.classList.add("on")};
  });
  $("a").oninput=upd;
  $("pay").onclick=function(){
    cu=$("c").value.trim()||"Customer";ve=$("v").value.trim()||"Vendor";cr=$("cur").value;
    var am=Math.max(0.01,parseFloat($("a").value)||0),tp=am*(tip/100);gf=fee(am);
    tot=cr==="MECS"?am+tp+gf:am+tp;oid="#ME-"+Math.floor(1e5+Math.random()*9e5);sn="ME-SN-2026-"+Math.floor(1e3+Math.random()*9e3);
    $("rec").className="rec";$("st").className="st";$("st").textContent="Funds Locked in ME Escrow";
    $("rf").style.display="none";$("rid").textContent=oid;$("sn").textContent=sn;
    $("sum").textContent=cu+" locked payment with "+ve+" for "+($("it").value||"Item");
    $("sub").textContent=am.toFixed(2)+" "+cr;$("tp").textContent=tp.toFixed(2)+" "+cr;$("gf").textContent=gf.toFixed(6)+" MEC";
    $("tot").textContent=cr==="MECS"?tot.toFixed(6)+" MECS":tot.toFixed(2)+" USDT (+ "+gf.toFixed(6)+" MEC gas)";
    $("oc").textContent=$("cid").value;$("ov").textContent=$("vid").value;$("tm").textContent=new Date().toLocaleString();$("hx").textContent=hsh();
    $("hd").textContent="Equal Escrow Terms - "+cu+" & "+ve+" Agreed";
    $("tt").textContent="Thank you, "+cu+", for using ME Network!";
    $("ts").textContent="Shop again with "+ve+" anytime for instant, low-fee escrow protection.";
    bar(sn);mrz(sn,cu,ve,tot,cr,false);$("rel").disabled=false;$("rfd").disabled=false;$("rec").style.display="block";
  };
  $("rel").onclick=function(){
    $("st").className="st rel";$("st").textContent="Delivery Confirmed - Funds Released";
    $("hd").textContent="Both Parties Satisfied - "+cu+" & "+ve+" Verified";
    $("tt").textContent="We appreciate your business on ME Network, "+cu+"!";
    $("ts").textContent="Come shop again at "+ve+" anytime!";
    $("rel").disabled=true;$("rfd").disabled=true;
  };
  $("rfd").onclick=function(){
    $("rec").className="rec ref";$("st").className="st rfd";$("st").textContent="Escrow Refunded - Immutable Adjustment";
    var r="#ME-REF-"+Math.floor(1e3+Math.random()*9e3);$("rid").textContent=r;$("rf").textContent="Original: "+oid;$("rf").style.display="block";
    $("gf").textContent=gf.toFixed(6)+" MEC + 0.000100 MEC (refund)";$("tm").textContent=new Date().toLocaleString();$("hx").textContent=hsh();
    $("hd").textContent="Mutual Refund Resolution - "+cu+" & "+ve+" Agreed";
    $("tt").textContent="Thank you for trusting ME Network, "+cu+"!";
    $("ts").textContent="Your funds are safe. Feel free to shop again with "+ve+" anytime!";
    bar(r.slice(1));mrz(sn,cu,ve,tot,cr,true);$("rel").disabled=true;$("rfd").disabled=true;
  };
  $("rst").onclick=function(){$("rec").style.display="none"};
  upd();
})();
</script>
</body>
</html>
