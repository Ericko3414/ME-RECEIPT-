<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ME-Receipt Demo</title>
  <style>
    body { font-family: sans-serif; background: #0b1120; color: #fff; padding: 16px; }
    .card { max-width: 420px; margin: auto; background: #111827; padding: 18px; border-radius: 12px; border: 1px solid #1f2937; }
    input { width: 100%; padding: 10px; margin: 6px 0 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #10b981; color: #064e3b; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .receipt { margin-top: 16px; padding: 14px; background: #122429; border: 1px solid #10b981; border-radius: 10px; display: none; }
    .hash { font-family: monospace; font-size: 11px; color: #93c5fd; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>ME-Receipt (Demo)</h2>
    <label>Customer Name</label>
    <input id="cust" value="Erick Otieno">
    <label>Item</label>
    <input id="item" value="Lunch & Juice">
    <label>Amount (MECS)</label>
    <input id="amt" type="number" value="10">
    <button onclick="pay()">🔒 Pay & Lock in Escrow</button>

    <div id="receipt" class="receipt">
      <h3 style="color:#34d399; margin-top:0;">✅ Verified ME-Receipt</h3>
      <p id="recSummary"></p>
      <p><strong>Receipt #:</strong> <span id="recId"></span></p>
      <p><strong>Time:</strong> <span id="recTime"></span></p>
      <p><strong>Tx Hash:</strong><br><span id="recHash" class="hash"></span></p>
    </div>
  </div>

  <script>
    function pay() {
      const cust = document.getElementById("cust").value;
      const item = document.getElementById("item").value;
      const amt = document.getElementById("amt").value;
      document.getElementById("recSummary").textContent = cust + " paid " + amt + " MECS for " + item;
      document.getElementById("recId").textContent = "ME-" + Math.floor(100000 + Math.random() * 900000);
      document.getElementById("recTime").textContent = new Date().toLocaleString();
      document.getElementById("recHash").textContent = "0x" + Math.random().toString(16).substring(2) + Math.random().toString(16).substring(2);
      document.getElementById("receipt").style.display = "block";
    }
  </script>
</body>
</html>
