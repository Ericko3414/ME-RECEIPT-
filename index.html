<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME-Receipt</title>
<style>
  body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 16px; max-width: 400px; margin: auto; }
  .box { background: #1e293b; padding: 20px; border-radius: 16px; }
  input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: none; font-size: 16px; }
  input, select { background: #0f172a; color: #fff; border: 1px solid #334155; box-sizing: border-box; }
  button { background: #10b981; color: #0f172a; font-weight: bold; cursor: pointer; }
  .hide { display: none; }
  .receipt { background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid #10b981; margin-top: 12px; }
</style>
</head>
<body>
<div class="box">
  <h2>ME-Receipt <small style="color:#34d399;font-size:12px;">(ME Network)</small></h2>
  <div id="s1">
    <input id="v" placeholder="Vendor Name" value="Campus Kiosk">
    <input id="i" placeholder="Item / Service" value="Lunch & Juice">
    <input id="a" type="number" placeholder="Amount" value="5">
    <select id="t"><option>USDT</option><option>MEC</option></select>
    <select id="tip"><option value="0">0% Tip</option><option value="5">5% Tip</option><option value="10">10% Tip</option></select>
    <button onclick="pay()">Pay & Lock Receipt</button>
  </div>
  <div id="s2" class="hide">
    <div class="receipt" id="out"></div>
    <button onclick="reset()">New Payment</button>
  </div>
</div>
<script>
  function pay() {
    let amt = parseFloat(document.getElementById('a').value) || 0;
    let pct = parseFloat(document.getElementById('tip').value) || 0;
    let total = (amt + amt * pct / 100).toFixed(2);
    let tok = document.getElementById('t').value;
    let id = 'ME-' + Math.floor(100000 + Math.random() * 900000);
    document.getElementById('out').innerHTML = `<b>&#10003; Verified on ME Network</b><br><br>ID: ${id}<br>Vendor: ${document.getElementById('v').value}<br>Item: ${document.getElementById('i').value}<br>Tip: ${pct}%<br><b>Total Paid: ${total} ${tok}</b><br><small style="color:#94a3b8;">Gas: 0.0001 MEC</small>`;
    document.getElementById('s1').className = 'hide';
    document.getElementById('s2').className = '';
  }
  function reset() {
    document.getElementById('s1').className = '';
    document.getElementById('s2').className = 'hide';
  }
</script>
</body>
</html>
