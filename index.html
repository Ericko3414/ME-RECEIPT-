<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ME-Receipt Demo</title>
<style>
  body { font-family: sans-serif; background: #0b1120; color: #fff; padding: 14px; }
  .card { max-width: 420px; margin: auto; background: #111827; padding: 16px; border-radius: 12px; border: 1px solid #1f2937; }
  label { font-size: 12px; color: #cbd5e1; }
  input, select { width: 100%; padding: 9px; margin: 4px 0 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px; box-sizing: border-box; }
  .tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 10px; }
  .tip-btn { padding: 8px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .tip-btn.active { background: #064e3b; border-color: #10b981; color: #6ee7b7; }
  .gas-preview { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid #1e293b; padding: 8px 10px; border-radius: 7px; font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
  .gas-preview span:last-child { color: #fbbf24; font-family: monospace; font-weight: bold; }
  .pay-btn { width: 100%; padding: 12px; background: #10b981; color: #064e3b; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .receipt { margin-top: 14px; padding: 14px; background: #122429; border: 1px solid #10b981; border-radius: 10px; display: none; font-size: 13px; line-height: 1.55; }
  .receipt.refunded { background: #26161a; border-color: #f87171; }
  .status { padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; text-align: center; margin-bottom: 10px; background: #2b2110; color: #fde68a; border: 1px solid #f59e0b66; }
  .status.released { background: #0f253e; color: #7dd3fc; border-color: #38bdf866; }
  .status.refund { background: #3b171d; color: #fecaca; border-color: #f8717166; }
  .meta-box { background: #0d1b20; padding: 8px 10px; border-radius: 7px; border-left: 3px solid #fbbf24; margin-bottom: 10px; font-family: monospace; font-size: 12px; }
  .sn { color: #fbbf24; font-weight: bold; }
  .ref-tag { display: none; margin-top: 4px; padding: 2px 6px; background: #7f1d1d; color: #fecaca; border-radius: 4px; font-size: 11px; }
  .mono { font-family: monospace; font-size: 11px; color: #93c5fd; word-break: break-all; }
  .fee-row { font-size: 12px; color: #fbbf24; font-family: monospace; }

  /* Barcode & Kenya ID MRZ Scan Styling */
  .scan-section { margin-top: 12px; padding: 10px; background: #f8fafc; color: #0f172a; border-radius: 8px; border: 1px solid #94a3b8; }
  .barcode-wrap { text-align: center; padding-bottom: 8px; border-bottom: 1px dashed #94a3b8; margin-bottom: 8px; }
  .barcode-wrap svg { width: 100%; height: 48px; display: block; }
  .barcode-label { font-family: monospace; font-size: 11px; letter-spacing: 2px; color: #334155; margin-top: 3px; font-weight: bold; }
  .mrz-box { font-family: "Courier New", Courier, monospace; font-size: 11.5px; font-weight: bold; letter-spacing: 1.4px; line-height: 1.35; color: #0f172a; background: #e2e8f0; padding: 7px 8px; border-radius: 5px; overflow-x: auto; white-space: pre; text-align: center; }
  .scan-caption { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #475569; text-align: center; margin-bottom: 4px; font-weight: bold; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .act-btn { padding: 9px; border-radius: 7px; border: none; font-weight: bold; font-size: 12.5px; cursor: pointer; }
  .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-release { background: #38bdf8; color: #082f49; }
  .btn-refund { background: #ef4444; color: #fff; }
  .btn-reset { grid-column: span 2; background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
</style>
</head>
<body>
<div class="card">
  <h2 style="margin-top:0;">ME-Receipt (Demo)</h2>
  <label>Customer Name</label>
  <input id="cust" value="Erick Otieno">
  <label>Customer ME ID / Wallet</label>
  <input id="custId" value="me1erick84x9m2p7q0w3e5r1">
  <label>Vendor Name</label>
  <input id="vendor" value="Campus Kiosk">
  <label>Vendor ME ID / Wallet</label>
  <input id="vendorId" value="me1kiosk92x8a4m7p0q5w3e9">
  <label>Item / Service</label>
  <input id="item" value="Lunch & Juice">
  <label>Amount & Currency</label>
  <div style="display:flex; gap:8px;">
    <input id="amt" type="number" value="10" min="0.01" step="0.01" style="flex:2;" oninput="updateGasPreview()">
    <select id="cur" style="flex:1;" onchange="updateGasPreview()">
      <option value="MECS">MECS</option>
      <option value="USDT">USDT</option>
    </select>
  </div>
  <label>Optional Tip</label>
  <div class="tips">
    <button type="button" class="tip-btn active" onclick="setTip(0, this)">0%</button>
    <button type="button" class="tip-btn" onclick="setTip(5, this)">5%</button>
    <button type="button" class="tip-btn" onclick="setTip(10, this)">10%</button>
    <button type="button" class="tip-btn" onclick="setTip(15, this)">15%</button>
  </div>

  <!-- Live Dynamic Gas Fee Estimate -->
  <div class="gas-preview">
    <span>⛽ Est. ME Network Gas Fee:</span>
    <span id="gasPreviewVal">0.000200 MEC</span>
  </div>

  <button class="pay-btn" onclick="pay()">🔒 Pay & Lock in Escrow</button>

  <div id="receipt" class="receipt">
    <div id="statusBadge" class="status">🔒 Funds Locked in ME Escrow</div>
    <h3 id="recTitle" style="color:#34d399; margin:0 0 8px;">✅ Verified ME-Receipt</h3>
    <div class="meta-box">
      <div><strong>Receipt No:</strong> <span id="recId"></span></div>
      <div><strong>Serial No (SN):</strong> <span id="snId" class="sn"></span></div>
      <div id="refTag" class="ref-tag"></div>
    </div>
    <div id="recSummary"></div>
    <hr style="border-color:#1e3a3a;">
    <div><strong>Subtotal:</strong> <span id="recSub"></span> | <strong>Tip:</strong> <span id="recTip"></span></div>
    <div class="fee-row"><strong>Network Gas Fee:</strong> <span id="recGas"></span></div>
    <div style="color:#34d399; font-weight:bold; margin-top:2px;">Total Paid: <span id="recTot"></span></div>
    <div class="mono" style="margin-top:4px;"><strong>From:</strong> <span id="outCustId"></span></div>
    <div class="mono"><strong>To:</strong> <span id="outVendId"></span></div>
    <div><strong>Time:</strong> <span id="recTime"></span></div>
    <div class="mono"><strong>Tx Hash:</strong> <span id="recHash"></span></div>

    <!-- Unique Barcode + Kenya ID-Style MRZ Scan Section -->
    <div class="scan-section">
      <div class="barcode-wrap">
        <div class="scan-caption">Unique Receipt Barcode</div>
        <svg id="barcodeSvg" xmlns="http://w3.org" preserveAspectRatio="none"></svg>
        <div id="barcodeText" class="barcode-label"></div>
      </div>
      <div class="scan-caption">Optical Machine-Readable Scan (MRZ)</div>
      <div id="mrzScan" class="mrz-box"></div>
    </div>

    <div class="actions">
      <button type="button" id="btnRelease" class="act-btn btn-release" onclick="releaseFunds()">✅ Confirm Delivery</button>
      <button type="button" id="btnRefund" class="act-btn btn-refund" onclick="refundReceipt()">↩️ Issue Refund</button>
      <button type="button" class="act-btn btn-reset" onclick="resetDemo()">➕ New Payment</button>
    </div>
  </div>
</div>

<script>
  let tipPct = 0;
  let origRecId = "";
  let currentSn = "";
  let currentCust = "";
  let currentVend = "";
  let currentTot = 0;
  let currentCur = "MECS";
  let currentGas = 0.0001;

  // Base fee ~0.0001 MEC + 0.001% scaling based on payment amount
  function calculateGasFee(amount) {
    const cleanAmt = Math.max(0, parseFloat(amount) || 0);
    const dynamicFee = 0.0001 + (cleanAmt * 0.00001);
    return Number(dynamicFee.toFixed(6));
  }

  function updateGasPreview() {
    const amt = parseFloat(document.getElementById("amt").value) || 0;
    const fee = calculateGasFee(amt);
    document.getElementById("gasPreviewVal").textContent = fee.toFixed(6) + " MEC";
  }

  function setTip(p, btn) {
    tipPct = p;
    document.querySelectorAll(".tip-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function newHash() {
    return "0x" + Math.random().toString(16).substring(2) + Math.random().toString(16).substring(2);
  }

  function renderBarcode(code) {
    const svg = document.getElementById("barcodeSvg");
    const clean = code.replace(/[^A-Z0-9]/gi, "").toUpperCase();
    let pattern = "1010110";
    for (let i = 0; i < clean.length; i++) {
      const charCode = clean.charCodeAt(i);
      const bits = ((charCode * 37 + i * 13) % 256).toString(2).padStart(8, "0");
      pattern += bits + "01";
    }
    pattern += "110101";

    svg.setAttribute("viewBox", `0 0 ${pattern.length * 2} 50`);
    let rects = "";
    for (let i = 0; i < pattern.length; i++) {
      if (pattern[i] === "1") {
        rects += `<rect x="${i * 2}" y="0" width="2" height="50" fill="#0f172a"/>`;
      }
    }
    svg.innerHTML = rects;
    document.getElementById("barcodeText").textContent = code;
  }

  function renderKenyaIdMrz(sn, cust, vend, tot, cur, isRefund) {
    const pad30 = (str) => str.toUpperCase().replace(/[^A-Z0-9<]/g, "<").padEnd(30, "<").slice(0, 30);

    const snDigits = sn.replace(/[^0-9]/g, "");
    const checkDigit = snDigits.split("").reduce((a, b) => a + parseInt(b, 10), 0) % 10;
    const statusFlag = isRefund ? "REF" : "ESC";

    const line1 = pad30(`IDKEN${snDigits}${checkDigit}<<${statusFlag}<<<<<<<<<<`);

    const now = new Date();
    const yymmdd = String(now.getFullYear()).slice(-2) +
                   String(now.getMonth() + 1).padStart(2, "0") +
                   String(now.getDate()).padStart(2, "0");
